name: Full reproduction
on:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python reproduce.py all --output-dir outputs/full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-results
          path: |
            outputs/full/run_report.json
            outputs/full/*.log
            outputs/full/figures/
